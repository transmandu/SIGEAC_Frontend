name: Formato

# Formatea los archivos del PR y commitea el resultado en la misma rama.
#
# Antes esto corria prettier --check y fallaba en rojo, dejando al autor la
# tarea mecanica de correr el formateador y volver a subir. La maquina sabe
# exactamente como debe quedar el archivo: que lo escriba ella. El check ya no
# pregunta "venia formateado" sino "quedo formateado".
#
# Solo los archivos que toca el PR. El resto del repo todavia no sigue el
# preset y se ira normalizando a medida que se edite cada archivo.

on:
  pull_request:
    branches: [main]

# contents: commitear en la rama del PR.
# actions: lanzar Calidad sobre ese commit (ver el último paso).
permissions:
  contents: write
  actions: write

# Si llegan dos pushes seguidos, la corrida vieja se cancela. Sin esto, dos
# jobs podrian intentar commitear a la vez sobre la misma rama.
concurrency:
  group: formato-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Formato · Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # - github-actions[bot]: el bot commitea; sin esto sus propios commits
    #   podrian disparar otra corrida.
    # - dependabot[bot]: en sus PR el token es de solo lectura por diseño, asi
    #   que el push fallaria en rojo; y aunque pudiera, un commit ajeno en su
    #   rama hace que Dependabot deje de rebasearla.
    if: >
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Por defecto el checkout de un PR deja la HEAD en modo detached.
          # Hay que estar sobre la rama real para poder hacer push.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formatear los archivos del PR
        id: fmt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # La lista viaja separada por NUL (-z / xargs -0) para que una ruta
          # con espacios no se parta en dos argumentos.
          LISTA="$RUNNER_TEMP/archivos-del-pr.list"
          git diff -z --name-only --diff-filter=d "origin/${BASE}...HEAD" \
            | { grep -zE '\.(ts|tsx|js|jsx|mjs|cjs|json|css)$' || true; } \
            > "$LISTA"

          if [ ! -s "$LISTA" ]; then
            echo "El PR no toca archivos formateables."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Archivos del PR:"
          tr '\0' '\n' < "$LISTA" | sed 's/^/  /'

          # --write, no --check: prettier reescribe lo que haga falta.
          # --ignore-unknown evita que un archivo excluido por .prettierignore
          # corte la corrida entera.
          xargs -0 -a "$LISTA" pnpm exec prettier --write --ignore-unknown

          if git diff --quiet; then
            echo "Todo ya estaba formateado."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=si" >> "$GITHUB_OUTPUT"
            {
              echo "arreglados<<EOF"
              git diff --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # Un PR desde un fork no da permiso de escritura sobre la rama de
      # origen: GitHub no lo permite, y no hay configuracion que lo cambie.
      # En ese caso el workflow avisa y termina en verde, en vez de bloquear
      # un PR por algo que su autor no puede resolver desde aca.
      - name: Avisar si viene de un fork
        if: >
          steps.fmt.outputs.cambios == 'si' &&
          github.event.pull_request.head.repo.full_name != github.repository
        # Los nombres de archivo vienen del fork: por env, nunca interpolados
        # en el script, o un archivo llamado `$(cmd)` ejecutaria el comando.
        env:
          ARREGLADOS: ${{ steps.fmt.outputs.arreglados }}
        run: |
          echo "::warning::Este PR viene de un fork y el formato no se puede"
          echo "::warning::commitear automaticamente. Corre 'pnpm format:changed'"
          echo "::warning::en tu rama y vuelve a subir."
          echo "Archivos que necesitan formato:"
          echo "$ARREGLADOS"

      - name: Commitear el formato y relanzar Calidad
        if: >
          steps.fmt.outputs.cambios == 'si' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          ARREGLADOS: ${{ steps.fmt.outputs.arreglados }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add --update

          # "style" mantiene la convencion de titulo-pr.yml y sube el parche,
          # no la menor: formatear no agrega funcionalidad.
          git commit -m 'style: formato automatico (prettier)' \
                     -m "$ARREGLADOS"

          # Si el autor empujó mientras corría el job, el push sería rechazado:
          # se rebasea sobre lo nuevo en vez de fallar en rojo.
          git pull --rebase origin "$RAMA"
          git push origin "HEAD:$RAMA"

          # Un push hecho con GITHUB_TOKEN no dispara `pull_request`, así que
          # el commit del bot quedaría sin Calidad (y sin el check que exige el
          # ruleset). Las excepciones a esa regla son workflow_dispatch y
          # repository_dispatch: se lanza Calidad a mano sobre la rama, y sus
          # checks se cuelgan del commit nuevo y del PR.
          gh workflow run calidad.yml --ref "$RAMA"

          echo "### Formato aplicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Se formatearon y commitearon estos archivos:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$ARREGLADOS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
