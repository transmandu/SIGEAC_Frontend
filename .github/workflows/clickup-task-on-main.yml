name: Crear tarea en ClickUp al subir a main

on:
  push:
    branches:
      - main

jobs:
  create-clickup-task:
    runs-on: ubuntu-latest
    steps:
      - name: Crear tarea completada en ClickUp
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n1)

          PAYLOAD=$(jq -n \
            --arg name "[$REPO_NAME] Fix: $FIRST_LINE" \
            --arg desc "Repo: $REPO_NAME
          Commit: $COMMIT_URL
          Autor: $COMMIT_AUTHOR
          SHA: $COMMIT_SHA" \
            --arg status "complete" \
            '{name: $name, description: $desc, status: $status}')

          curl -s -X POST "https://api.clickup.com/api/v2/list/$CLICKUP_LIST_ID/task" \
            -H "Authorization: $CLICKUP_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"